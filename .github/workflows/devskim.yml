# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '20 23 * * 5'

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@734c6ed89671b1c7a5211ed334c79db261e3f221 # v1
        with:
          # Production code is scanned; test data, vendored libraries, translations, and the demo
          # site only produced false positives (sample URLs, localhost, test keys).
          ignore-globs: "**/.git/**,**/bin/**,**/obj/**,**/tests/**,**/wwwroot/lib/**,**/locales/*.json,**/tools/demo-site/**"
          # DS172411 flags every setTimeout, whatever it's given. ESLint's no-implied-eval
          # (eslint.config.mjs) reports the ones that are really given a string of code.
          exclude-rules: "DS172411"

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: devskim-results.sarif
