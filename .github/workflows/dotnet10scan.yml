name: ".NET 10 Security Build"

on:
  push:
    paths: [ '**.cs', '**.csproj', '**.sln', '**.slnx', '**.props', '.github/workflows/dotnet10scan.yml' ]
  pull_request:
    paths: [ '**.cs', '**.csproj', '**.sln', '**.slnx', '**.props', '.github/workflows/dotnet10scan.yml' ]
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Build and generate SARIF
        # Outputs all C# compiler, .NET analyzer, and SCS warnings to SARIF, one file per project
        # (see Directory.Build.props). Not locked restore: the runner's newest SDK can pull a newer
        # ILLink than the lock files (made with the release machine's SDK) list, and this build
        # ships nothing.
        run: dotnet build LarisVMS.slnx --configuration Release -p:RestoreLockedMode=false -p:SarifDir=${{ github.workspace }}/sarif

      - name: Give each project its own category
        # Code scanning takes one run per category, and every project's file is a run from the same
        # tool (the C# compiler), so each gets its own: dotnet10-scs/<project>.
        # Also left out: results under a "#pragma warning disable" (checked by hand, each with its
        # reason; the compiler still writes them, marked as suppressed, and code scanning would
        # open alerts for them) and results in generated code under obj/.
        if: always()
        run: |
          for f in sarif/*.sarif; do
            name=$(basename "$f" .sarif)
            jq --arg id "dotnet10-scs/$name/" '.runs |= map(.automationDetails = {id: $id}
              | .results |= map(select(((.suppressions // []) | length) == 0
                  and ((.locations[0].physicalLocation.artifactLocation.uri // "") | test("/obj/") | not))))' \
              "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          # No category here: it would override the per-project ones set above.
          sarif_file: sarif
