# Tells the website repo (billacuda/larisvms-template) to rebuild and redeploy www.larisvms.com
# when a release is published or edited, or when README.md / CHANGELOG.md change on main.
#
# Required repository secret: SITE_DISPATCH_TOKEN, a fine-grained personal access token with
# access to billacuda/larisvms-template only, and "Contents: Read and write" permission.
name: Notify website

on:
  release:
    types: [published, edited, deleted]
  push:
    branches: [main]
    paths:
      - README.md
      - CHANGELOG.md
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website deploy
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/billacuda/larisvms-template/dispatches \
            -d '{"event_type":"larisvms-updated"}'
