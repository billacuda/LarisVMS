# separate terms of service, privacy policy, and support
# documentation.
# ESLint is a tool for identifying and reporting on patterns
# found in ECMAScript/JavaScript code.
# More details at https://github.com/eslint/eslint
# and https://eslint.org

name: "ESLint Security Scan"

on:
  push:
    paths: [ '**.js', '**.mjs', 'eslint.config.mjs', '.github/workflows/eslint.yml' ]
  pull_request:
    paths: [ '**.js', '**.mjs', 'eslint.config.mjs', '.github/workflows/eslint.yml' ]
  workflow_dispatch:

jobs:
  eslint:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # No package.json: the linter and its rules are pinned here (eslint.config.mjs uses them).
      - name: Install ESLint
        run: >
          npm install --no-save --no-audit --no-fund
          eslint@10.13.0
          eslint-plugin-security@4.2.0
          eslint-plugin-no-unsanitized@4.1.5
          @microsoft/eslint-formatter-sarif@3.1.0

      # Findings exit non-zero; the upload below still runs so they reach code scanning.
      # Lines marked "eslint-disable-next-line ... -- reviewed: ..." were checked by hand; leave
      # them out of the upload rather than sending them as suppressed results.
      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: npx eslint . --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          category: eslint
