# Keeps the commit-pinned GitHub Actions in .github/workflows up to date. NuGet security updates
# come from Dependabot alerts; versions are otherwise chosen by hand (Directory.Packages.props).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Wait a week after a release before proposing it, so a hijacked release is likely caught first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
