# Keeps the commit-pinned GitHub Actions in .github/workflows up to date. NuGet security updates
# come from Dependabot alerts; versions are otherwise chosen by hand (Directory.Packages.props).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
